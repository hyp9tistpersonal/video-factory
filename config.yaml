niche: "دانستنی‌های جذاب و کمتر شنیده‌شده درباره ایران؛ شامل تاریخ، فرهنگ، معماری، طبیعت، شهرها، اختراعات و شخصیت‌های ایرانی"

extra_style_notes: |
  تمام ویدیو باید مستقیماً درباره ایران باشد.
  لحن جذاب، محاوره‌ای و قابل‌باور باشد.
  ادعاهای تاریخی مشکوک، افسانه‌ای یا بدون منبع را به‌عنوان واقعیت بیان نکن.
  از توهین قومی، مذهبی و سیاسی خودداری کن.
  نام مکان‌ها و شخصیت‌ها را دقیق بنویس.
  موضوع هر ویدیو با ویدیوهای قبلی متفاوت باشد.

spoken_style_notes: |
  روایت باید گرم، صمیمی و کاملاً گفتاری باشد.
  انگار یک دوست دارد با هیجان کنترل‌شده داستان تعریف می‌کند.
  جمله‌ها کوتاه و ساده باشند.
  از لحن خبری، اداری، کتابی و عبارت‌های سنگین استفاده نکن.
  از عبارت‌هایی مثل «می‌باشد»، «می‌گردد»، «لذا» و «بنابراین» استفاده نکن.
  به‌جای «این بنا در دوره صفوی ساخته شده است» بنویس «این بنا رو زمان صفوی ساختن».
  لحن خودمانی باشد، ولی لوس، کوچه‌بازاری یا پر از تکیه‌کلام نباشد.
  اطلاعات را دقیق نگه دار و برای خودمانی‌شدن، واقعیت را تغییر نده.

