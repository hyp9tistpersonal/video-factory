  - از جنسی‌سازی زنان یا مردان در تصاویر عطر خودداری کن
  - در تصاویر انتخاب عطر از بزرگسالان استفاده کن
deduplication:
  enabled: true
  history_file: content_history.json
  store_fields:
  - topic
  - main_entity
  - dimension
  - subtopic
  - country
  - region
  - historical_period
  - story_angle
  - hook
  - main_fact
  - keywords
  - publish_date
  similarity_checks:
    topic_similarity_threshold: 0.78
    hook_similarity_threshold: 0.7
    script_similarity_threshold: 0.76
    keyword_overlap_threshold: 0.65
  lookback:
    exact_topic_videos: 100
    similar_topic_videos: 50
    same_entity_videos: 60
    same_hook_videos: 30
    same_dimension_videos: 10
  reject_on_exact_match: true
  reject_on_high_similarity: true
  allow_revisit_after_videos: 120
  revisit_rules: |-
    یک موضوع قدیمی فقط وقتی دوباره استفاده شود که زاویه روایت،
    سؤال اصلی و اطلاعات ارائه‌شده واقعاً متفاوت باشند.

    تغییر چند کلمه در عنوان، موضوع تکراری را به موضوع جدید تبدیل نمی‌کند.
output_schema:
  required_fields:
  - topic
  - dimension
  - subtopic
  - story_angle
  - hook
  - summary
  - voice_profile
  - scenes
  - title
  - description
  - hashtags
  - sources
  - fact_check_notes
  scene_fields:
  - scene_number
  - narration
  - visual_description
  - keywords
  - visual_type
  - source_fact
  output_rules: |-
    خروجی باید دقیقاً پنج صحنه داشته باشد.

    هر صحنه باید متن گفتار، توضیح تصویر و keywords مستقل داشته باشد.

    keywords باید انگلیسی، دقیق و قابل جست‌وجو باشند.

    source_fact باید مشخص کند اطلاعات اصلی صحنه از چه نوع منبعی آمده.

    متن گفتار نباید شامل نشانی اینترنتی یا نام کامل منابع باشد.

    منابع در بخش sources قرار بگیرند.

    توضیحات فنی تولید ویدیو وارد متن گفتار نشوند.
metadata_rules:
  title:
    minimum_characters: 25
    maximum_characters: 75
    rules:
    - موضوع اصلی را مشخص کند
    - ابهام مصنوعی ایجاد نکند
    - ادعای دروغین نداشته باشد
    - از حروف کشیده و علامت‌های زیاد استفاده نکند
    - نام مهم را دقیق بنویسد
    - در صورت امکان شامل سؤال یا نکته اصلی باشد
    forbidden_patterns:
    - باورت نمی‌شه
    - شوک بزرگ
    - راز باورنکردنی
    - هیچ‌کس نمی‌دونه
    - صددرصد واقعی
    - دانشمندان شوکه شدند
    - فوری
    - حتماً ببین
  description:
    minimum_sentences: 2
    maximum_sentences: 4
    rules:
    - خلاصه واقعی ویدیو را بنویسد
    - اطلاعات تازه و تأییدنشده اضافه نکند
    - در صورت حساس‌بودن موضوع، محدودیت یا عدم‌قطعیت را ذکر کند
    - با لحن طبیعی نوشته شود
    - از تکرار کامل متن ویدیو خودداری کند
  call_to_action:
    enabled: true
    probability: 0.35
    allowed:
    - تو درباره این موضوع چی فکر می‌کنی؟
    - کدوم بخشش برات جالب‌تر بود؟
    - دوست داری داستان کدوم موضوع رو ببینی؟
    - این باور رو قبلاً شنیده بودی؟
    rules:
    - در همه ویدیوها استفاده نشود
    - سؤال باید با موضوع مرتبط باشد
    - از درخواست مصنوعی برای لایک و فالو خودداری شود
hashtag_rules:
  minimum_count: 12
  maximum_count: 12
