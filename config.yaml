channel_identity:
  name: دانستنی‌ها و مهارت‌های زنان و جهان
  niche: دانستنی‌ها، مهارت‌ها و روایت‌های جذاب و دقیق درباره جهان و انسان، با تمرکز پررنگ‌تر بر زنان، دختران، تاریخ زنان،
    سبک زندگی، هنر، پوشاک، خیاطی، صنایع‌دستی، فرهنگ، حرکت و رقص عربی؛ در کنار حفظ تمام موضوع‌های علمی، تاریخی، طبیعی، فناوری،
    روان‌شناسی و فرهنگی نسخه جامع.
  core_theme: شناخت بهتر جهان، انسان و پدیده‌هایی که زندگی ما را شکل می‌دهند.
  mission: تولید ویدیوهای کوتاه، قابل‌فهم، مستند و تصویری که در هر قسمت حداقل یک نکته واقعی و ارزشمند به مخاطب یاد بدهند؛
    بدون جعل، اغراق، تحریف، شبه‌علم یا تیترهای فریبنده.
  content_promise: هر ویدیو باید یک سؤال مشخص را پاسخ بدهد، یک پدیده را توضیح بدهد یا یک داستان واقعی و قابل‌بررسی را روایت
    کند.
  audience:
    primary:
    - فارسی‌زبان‌های علاقه‌مند به دانستنی‌های عمومی
