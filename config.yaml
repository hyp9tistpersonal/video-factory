run_report:

enabled: true

include:
- "موضوع انتخاب‌شده"
- "ستون محتوایی"
- "زاویه روایت"
- "دلیل انتخاب موضوع"
- "موضوع‌های ردشده"
- "دلیل رد موضوع‌ها"
- "منابع بررسی‌شده"
- "موارد دارای عدم‌قطعیت"
- "نتیجه بررسی تکراری‌بودن"
- "پروفایل صدا"
- "مدت نهایی ویدیو"
- "نتیجه انتشار"
- "نشانی ویدیوی منتشرشده"

fail_on_missing_report: false

