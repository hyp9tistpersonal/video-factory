    - adult woman modest clothing reflection
    - religious textile embroidery hands
  comment_policy:
    dynamic: true
    fixed_suffix_forbidden: true
    practical_and_reflective: true
    sectarian_questions_forbidden: true
youtube_comment_style_notes: |-
  برای هر ویدیو یک کامنت متفاوت و مخصوص همان موضوع بنویس.
  کامنت نباید پسوند یا جمله ثابت داشته باشد.
  کامنت را با سؤال طبیعی و مشخص تمام کن.
  از تکرار دائمی عبارت‌های «نظرتون رو توی کامنتا بگید»،
  «موافقید یا مخالفید؟» و «شما چی فکر می‌کنید؟» خودداری کن.

