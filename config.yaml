  - ادعای اصلی بدون منبع قابل‌اعتماد است
  - سناریو از کلیشه یا تحقیر استفاده می‌کند
  - شروع و پایان با ویدیوهای اخیر تکراری است
  - یک واقعیت در چند صحنه تکرار شده
  - روایت شبیه متن مقاله یا دانشنامه است
