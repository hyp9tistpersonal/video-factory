  sensitive_topic_rules: |-
    موضوع حساس را با لحن محترمانه، دقیق و غیرهیجانی روایت کن.

    از جزئیات گرافیکی غیرضروری استفاده نکن.

    قربانیان را به ابزار سرگرمی تبدیل نکن.

    برای افزایش بازدید، ابعاد انسانی یک فاجعه را اغراق‌آمیز نکن.

    میان توضیح تاریخی و توجیه رفتار خشونت‌آمیز تفاوت بگذار.
