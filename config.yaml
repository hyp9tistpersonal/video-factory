# =====================================================

# حافظه و جلوگیری از تکرار

# =====================================================

deduplication:

enabled: true

history_file: "content_history.json"

store_fields:
- "topic"
- "main_entity"
- "dimension"
- "subtopic"
- "country"
- "region"
- "historical_period"
- "story_angle"
- "hook"
- "main_fact"
- "keywords"
- "publish_date"

similarity_checks:
topic_similarity_threshold: 0.78
hook_similarity_threshold: 0.70
script_similarity_threshold: 0.76
keyword_overlap_threshold: 0.65

lookback:
exact_topic_videos: 100
similar_topic_videos: 50
same_entity_videos: 60
same_hook_videos: 30
same_dimension_videos: 10

reject_on_exact_match: true

reject_on_high_similarity: true

allow_revisit_after_videos: 120

revisit_rules: |
یک موضوع قدیمی فقط وقتی دوباره استفاده شود که زاویه روایت،
سؤال اصلی و اطلاعات ارائه‌شده واقعاً متفاوت باشند.

```
تغییر چند کلمه در عنوان، موضوع تکراری را به موضوع جدید تبدیل نمی‌کند.
```

# =====================================================

# قالب خروجی سناریو

# =====================================================

output_schema:

required_fields:
- "topic"
- "dimension"
- "subtopic"
- "story_angle"
- "hook"
- "summary"
- "voice_profile"
- "scenes"
- "title"
- "description"
- "hashtags"
- "sources"
- "fact_check_notes"

scene_fields:
- "scene_number"
- "narration"
- "visual_description"
- "keywords"
- "visual_type"
- "source_fact"

output_rules: |
خروجی باید دقیقاً پنج صحنه داشته باشد.

```
هر صحنه باید متن گفتار، توضیح تصویر و keywords مستقل داشته باشد.

keywords باید انگلیسی، دقیق و قابل جست‌وجو باشند.

source_fact باید مشخص کند اطلاعات اصلی صحنه از چه نوع منبعی آمده.

متن گفتار نباید شامل نشانی اینترنتی یا نام کامل منابع باشد.

منابع در بخش sources قرار بگیرند.

توضیحات فنی تولید ویدیو وارد متن گفتار نشوند.
```

