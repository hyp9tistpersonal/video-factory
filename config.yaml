  - هیچ مقایسه فرقه‌ای یا مناظره مذهبی تولید نشود
  - هیچ نقل‌قول جعلی یا منبع‌سازی مذهبی انجام نشود
  - هیچ فتوای شخصی یا حکم شرعی بدون منبع معتبر ارائه نشود
  - موضوع‌های مذهبی با لحن محترمانه، اخلاقی و کاربردی باشند
  fragrance_rules:
  - عطر را درمان یا عامل جذب قطعی معرفی نکن
  - ادعای فرومون تضمینی مطرح نکن
  - در واکنش پوستی توصیه عمومی و ایمن بده
