final_acceptance:
  all_required: true
  criteria:
  - موضوع محدود و مشخص است
  - موضوع با خروجی‌های اخیر تکراری نیست
  - حداقل دو منبع مستقل بررسی شده
  - ادعای اصلی دقیق و قابل‌بررسی است
  - عدم‌قطعیت‌ها مشخص شده‌اند
  - سناریو دقیقاً پنج صحنه دارد
  - روایت بین سی‌وپنج تا پنجاه‌وهشت ثانیه است
  - زبان محاوره‌ای و طبیعی است
  - هیچ جمله رسمی و سنگین غیرضروری وجود ندارد
  - قلاب واقعی و غیرکلیک‌بیتی است
  - هر صحنه تصویر مرتبط دارد
  - keywords دقیق و انگلیسی هستن
  - افسانه با واقعیت مخلوط نشده
  - هیچ گروه انسانی تحقیر نشده
  - عنوان با محتوای ویدیو هماهنگ است
  - هشتگ‌ها مرتبط هستن
  - ویدیو حداقل یک نکته روشن به مخاطب یاد می‌دهد
  - در موضوع زنانه، تصویر اول زن بزرگسال یا سوژه زنانه مرتبط دارد
  - در بیشتر خروجی‌ها، صحنه اول به‌طور طبیعی حضور زن بزرگسال دارد
  - زن یا دختر برای کلیک‌بیت یا جنسی‌سازی استفاده نشده
  - موضوع خیاطی دارای keywords دقیق ابزار، پارچه و فعالیت است
  - موضوع رقص فقط بزرگسالان را در زمینه آموزشی یا فرهنگی نمایش می‌دهد
  on_failure: reject_and_generate_new_topic
