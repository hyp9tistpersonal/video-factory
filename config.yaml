scope_rules: |-
  هر ویدیو فقط یک موضوع اصلی، محدود و مشخص داشته باشد.

  موضوع نباید بیش‌ازحد کلی باشد.

  نمونه موضوع ضعیف:
  «تاریخ جهان»

  نمونه موضوع مناسب:
  «چرا شهر پمپئی زیر خاکستر آتشفشان حفظ شد؟»

  نمونه موضوع ضعیف:
  «مغز انسان»

  نمونه موضوع مناسب:
  «چرا مغز بعضی خاطره‌ها رو اشتباه بازسازی می‌کنه؟»

  نمونه موضوع ضعیف:
  «فضا»

  نمونه موضوع مناسب:
  «چرا در سیاره زهره یک روز از یک سال طولانی‌تره؟»

  هر موضوع باید حداقل یکی از این ویژگی‌ها را داشته باشد:

  * یک سؤال روشن
  * یک اتفاق واقعی
  * یک سازوکار قابل‌توضیح
  * یک شخصیت اثرگذار
  * یک مکان خاص
  * یک کشف علمی
  * یک اختراع
  * یک رسم فرهنگی
  * یک پدیده طبیعی
  * یک نکته تاریخی کمتر شنیده‌شده
  * یک باور رایج که نیاز به اصلاح دارد

  موضوع باید در حدود سی‌وپنج تا پنجاه‌وپنج ثانیه قابل‌توضیح باشد.

  موضوع‌هایی که برای فهم درست به توضیح طولانی نیاز دارن،
  باید به چند ویدیوی مستقل تقسیم بشن.

  در هر ویدیو فقط اطلاعاتی استفاده کن که مستقیماً به موضوع اصلی مربوط هستن.

  اطلاعات جذاب ولی نامرتبط را فقط برای هیجان بیشتر وارد روایت نکن.

  یک موضوع علمی را به داستان تاریخی تبدیل نکن، مگر اینکه تاریخچه آن
  بخش واقعی و مهم موضوع باشد.

  یک موضوع تاریخی را با توضیحات افسانه‌ای، ماورایی یا اثبات‌نشده
  مخلوط نکن.

  تفاوت میان واقعیت، نظریه، فرضیه، تخمین، روایت و افسانه باید روشن باشد.
