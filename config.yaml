  - یکی از عجیب‌ترین چیزهای دنیا
  - یک حقیقت باورنکردنی
  allowed_hook_patterns:
  - یک سؤال مشخص
  - یک تضاد واقعی
  - یک اتفاق غیرمنتظره
  - یک تصویر ذهنی دقیق
  - یک عدد مستند و معنادار
  - شروع مستقیم از لحظه اصلی داستان
  - اصلاح یک باور اشتباه
  - توضیح یک کارکرد ناشناخته
  hook_examples:
  - روی سیاره زهره، یک روز از یک سال طولانی‌تره.
  - رومی‌ها برای تمیزکردن لباس‌ها از ماده‌ای استفاده می‌کردن که امروز عجیب به نظر می‌رسه.
  - اختاپوس سه تا قلب داره، اما موقع شنا یکی از اون‌ها تقریباً از کار می‌افته.
  - حافظه انسان مثل دوربین فیلم‌برداری کار نمی‌کنه.
  - این شهر باستانی به خاطر یک فاجعه، بهتر از خیلی شهرهای دیگه حفظ شد.
video_structure:
  scenes_count: 5
  target_duration_seconds:
    minimum: 35
    ideal: 45
    maximum: 58
  script_word_count:
    minimum: 85
    ideal: 105
    maximum: 130
  scene_1:
    purpose: قلاب و معرفی فوری موضوع
    duration_seconds: 5-8
    max_sentences: 2
    rules:
    - بدون مقدمه اضافی شروع شود
    - موضوع در همان جمله اول مشخص باشد
    - ادعای اصلی مبهم نباشد
    - تیتر دروغین یا اغراق‌آمیز نباشد
    - در موضوع‌های زنانه، سوژه اصلی صحنه اول زن بزرگسال یا دختر جوان بزرگسال مرتبط با موضوع باشد
    - در حدود سه‌چهارم ویدیوها، وقتی طبیعی و مرتبط است، صحنه اول حضور یک زن بزرگسال داشته باشد
    - keywords صحنه اول باید نوع فعالیت زن را مشخص کند؛ نه فقط woman portrait
    - برای خیاطی از نمای زن خیاط، دست‌ها، چرخ، الگو یا پارچه استفاده شود
    - برای رقص فقط زن بزرگسال در تمرین یا اجرای فرهنگی محترمانه نمایش داده شود
  scene_2:
    purpose: زمینه لازم
    duration_seconds: 7-11
    max_sentences: 3
    rules:
    - زمان، مکان یا مفهوم لازم را توضیح بده
    - فقط اطلاعات ضروری را وارد کن
    - از فهرست‌کردن چند واقعیت نامرتبط خودداری کن
  scene_3:
    purpose: مهم‌ترین توضیح یا اتفاق
    duration_seconds: 8-13
    max_sentences: 3
    rules:
    - سازوکار، اتفاق یا کشف اصلی را توضیح بده
    - رابطه علت و معلولی را روشن کن
    - از پرش ناگهانی در روایت خودداری کن
  scene_4:
    purpose: نکته عمیق‌تر، پیامد یا غافلگیری واقعی
    duration_seconds: 8-13
    max_sentences: 3
    rules:
    - اطلاعات جدید و مهم اضافه کن
    - جمله قبلی را فقط با کلمات دیگر تکرار نکن
    - اگر عدم‌قطعیت وجود دارد، همین‌جا مشخص کن
  scene_5:
    purpose: جمع‌بندی طبیعی
    duration_seconds: 5-10
    max_sentences: 2
    rules:
    - نتیجه اصلی را روشن کن
    - اطلاعات تازه و توضیح‌نداده وارد نکن
    - پایان اجباری با سؤال نداشته باش
    - دعوت به تعامل فقط در صورت طبیعی‌بودن استفاده شود
  burn_subtitles: false
  caption_words: 3
