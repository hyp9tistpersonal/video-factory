channel_identity:

name: "دانستنی‌های جهان و انسان"

niche: >
دانستنی‌های جذاب، واقعی، دقیق و کمتر شنیده‌شده درباره جهان،
طبیعت، تاریخ، تمدن‌ها، علم، فناوری، بدن انسان، ذهن، روان،
جامعه، فرهنگ، زبان، هنر، اقتصاد، سیاست، فلسفه، محیط‌زیست،
زندگی روزمره و آینده بشر.

core_theme: >
شناخت بهتر جهان، انسان و پدیده‌هایی که زندگی ما را شکل می‌دهند.

mission: >
تولید ویدیوهای کوتاه، قابل‌فهم، مستند و تصویری که در هر قسمت
حداقل یک نکته واقعی و ارزشمند به مخاطب یاد بدهند؛ بدون جعل،
اغراق، تحریف، شبه‌علم یا تیترهای فریبنده.

content_promise: >
هر ویدیو باید یک سؤال مشخص را پاسخ بدهد، یک پدیده را توضیح بدهد
یا یک داستان واقعی و قابل‌بررسی را روایت کند.

audience:
primary:
- "فارسی‌زبان‌های علاقه‌مند به دانستنی‌های عمومی"
- "مخاطبان ویدیوهای کوتاه آموزشی"
- "نوجوانان و جوانان"
- "افراد کنجکاو درباره جهان و انسان"

```
secondary:
