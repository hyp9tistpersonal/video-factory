  - برای مد، خیاطی و رقص، سوژه تصویری پیش‌فرض زن بزرگسال باشد
  - کودک یا نوجوان در اجرای رقص عربی نمایش داده نشود
  - آموزش رقص باید ایمن، غیرپزشکی و در دامنه بدون درد باشد
  - هیچ ادعای پزشکی درباره اثر رقص یا ورزش مطرح نکن
  - موضوع‌های مربوط به بدن با زبان محترمانه و غیرقضاوتی بیان شوند
  - از کلیشه‌های ظاهری و استانداردهای غیرواقعی زیبایی خودداری کن
deduplication:
  enabled: true
  history_file: content_history.json
  store_fields:
  - topic
  - main_entity
  - dimension
  - subtopic
  - country
  - region
  - historical_period
  - story_angle
  - hook
  - main_fact
  - keywords
  - publish_date
  similarity_checks:
    topic_similarity_threshold: 0.78
    hook_similarity_threshold: 0.7
    script_similarity_threshold: 0.76
    keyword_overlap_threshold: 0.65
  lookback:
    exact_topic_videos: 100
    similar_topic_videos: 50
    same_entity_videos: 60
    same_hook_videos: 30
    same_dimension_videos: 10
  reject_on_exact_match: true
  reject_on_high_similarity: true
  allow_revisit_after_videos: 120
  revisit_rules: |-
    یک موضوع قدیمی فقط وقتی دوباره استفاده شود که زاویه روایت،
    سؤال اصلی و اطلاعات ارائه‌شده واقعاً متفاوت باشند.

    تغییر چند کلمه در عنوان، موضوع تکراری را به موضوع جدید تبدیل نمی‌کند.
