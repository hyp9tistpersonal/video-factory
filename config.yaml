«طبق یک افسانه قدیمی...»

«در یک روایت محلی گفته می‌شه...»

«بعضی منابع قدیمی این داستان رو نقل کردن...»

«این بخش بیشتر روایت عامیانه‌ست تا واقعیت تاریخی ثابت‌شده.»
```

numeric_precision: |
