# =====================================================

publishing:

enable_youtube: true

enable_instagram: false

privacy_status: "public"

category_id: 27

upload_as_short: true

allow_automatic_publish: true

reject_publish_if_fact_check_failed: true

reject_publish_if_visual_match_failed: true

reject_publish_if_duplicate_detected: true

reject_publish_if_duration_exceeded: true

reject_publish_if_required_fields_missing: true

# =====================================================

# زیرنویس

# =====================================================

subtitles:

burn_subtitles: false

generate_srt: true

generate_vtt: false

caption_words: 3

punctuation_enabled: true

normalize_persian_characters: true

use_persian_numbers: false

remove_zero_width_characters: true

# =====================================================

# مدیریت فایل‌های موقت

# =====================================================

temporary_files:

keep_days: 1

delete_downloaded_media: true

delete_generated_audio: false

delete_final_video: false

keep_logs: true

keep_metadata: true

keep_source_list: true

keep_content_history: true

# =====================================================

