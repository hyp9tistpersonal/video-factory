# config200 — نسخه دقیق برای factory6
# فقط اصلاحات مربوط به دقت بصری صحنه‌ها و حضور زن در صحنه اولِ موضوع‌های زنانه
# ساختار هشتگ‌ها همان ۷ ثابت + ۵ موضوعی باقی مانده است.
# =====================================================

config_version: '200'
niche: دانستنی‌ها، مهارت‌ها و روایت‌های جذاب و دقیق درباره جهان و انسان، با تمرکز پررنگ‌تر بر زنان، دختران، تاریخ زنان، سبک
  زندگی، هنر، پوشاک، خیاطی، صنایع‌دستی، فرهنگ، حرکت و رقص عربی؛ در کنار حفظ تمام موضوع‌های علمی، تاریخی، طبیعی، فناوری، روان‌شناسی
  و فرهنگی نسخه جامع؛ همچنین آموزه‌های قرآن، نهج‌البلاغه، سیره امام علی و امام حسین، عاشورا، اربعین و فرهنگ شیعه با رویکرد
  کاربردی، محترمانه و غیرجدلی ولی بیشتر سمت دختران، تاریخ زنان، سبک زندگی، هنر، پوشاک، خیاطی، صنایع‌دستی، فرهنگ، حرکت و رقص
  عربی؛ همچنین عطر، ادکلن، خانواده‌های بویایی، انتخاب رایحه زنانه و مردانه، عطر مناسب فصل‌ها، موقعیت‌ها، نگهداری و آموزش عمومی
  عطرشناسی.
extra_style_notes: |
  هر ویدیو فقط یک موضوع اصلی و مشخص داشته باشد.

  اطلاعات تاریخی، علمی، پزشکی، روان‌شناختی، اجتماعی و جغرافیایی
  باید دقیق و قابل‌بررسی باشند.

  ادعای مشکوک، افسانه‌ای یا تأییدنشده را به‌عنوان واقعیت قطعی بیان نکن.

  از اغراق‌های دروغین استفاده نکن:

  «هیچ‌کس نمی‌داند»

  «بزرگ‌ترین راز تاریخ»

  «دانشمندان شوکه شدند»

  «همه‌چیز را تغییر داد»

  «باورت نمی‌شود»

  «صددرصد ثابت شده»

  مگر اینکه معنای دقیق جمله واقعاً قابل‌اثبات باشد.

  از توهین قومی، ملی، مذهبی، زبانی، نژادی، جنسیتی،
  سیاسی، منطقه‌ای و طبقاتی خودداری کن.

  نام اشخاص، کشورها، شهرها، تمدن‌ها، بناها، آثار،
  دوره‌های تاریخی، گونه‌های جانوری و اصطلاحات علمی را دقیق بنویس.

  تلفظ فارسی نام‌های خارجی باید تا حد ممکن رایج و قابل‌فهم باشد.

  در صورت وجود چند تلفظ، شکل رایج‌تر فارسی را انتخاب کن.

  نام علمی یا انگلیسی موضوع فقط در keywords نوشته شود،
  مگر اینکه گفتن آن برای فهم روایت لازم باشد.

  کلیپ پیشنهادی هر صحنه باید مستقیماً با همان بخش روایت مرتبط باشد.

  از کلیپ‌های صرفاً زیبا ولی نامرتبط استفاده نکن.

  اگر تصویر واقعی موضوع پیدا نمی‌شود، کلیپ گمراه‌کننده پیشنهاد نده.

  در این حالت از یکی از این موارد استفاده کن:

  * نقشه مرتبط
  * دست‌نوشته یا سند
  * تصویر موزه‌ای
  * نمای نزدیک از جزئیات
  * بازسازی علمی معتبر
  * تصویر محیط طبیعی مرتبط
  * نمودار ساده
  * مدل سه‌بعدی مرتبط
  * تصویر ماهواره‌ای
  * تصویر ابزار یا شیء مرتبط

  بازسازی هنری را به‌عنوان تصویر واقعی معرفی نکن.

  اگر تصویر بازسازی‌شده است، در توضیح کلیپ بنویس:
  «بازسازی هنری» یا «scientific reconstruction».

  موضوع، زاویه روایت، جمله آغازین و ترتیب اطلاعات
  باید با خروجی‌های قبلی متفاوت باشد.

  اطلاعات را برای هیجان بیشتر تغییر نده.

  ساده‌سازی را با تحریف اشتباه نگیر.

  از نتیجه‌گیری اخلاقی یا فلسفی اجباری در پایان همه ویدیوها خودداری کن.

  پایان ویدیو باید متناسب با موضوع باشد؛ نه همیشه سؤال تعاملی.

  تمرکز محتوایی این نسخه باید بیشتر به سمت زنان و دختران باشد، اما کانال فقط زنانه نباشد.

  حدود دو سوم موضوع‌های انتخابی باید یکی از این محورهای واقعی و آموزشی را داشته باشند:
  تاریخ زنان، زنان اثرگذار، زندگی روزمره زنان، آموزش و مهارت‌های زنان،
  پوشاک و مد، خیاطی، دوخت‌ودوز، پارچه، صنایع‌دستی، هنرهای زنانه،
  سلامت عمومی زنان، روان‌شناسی و تجربه‌های اجتماعی زنان،
  آموزش دختران، زنان در علم و فناوری، زنان در هنر و ورزش،
  و رقص عربی به‌عنوان هنر، فرهنگ، حرکت و تمرین بدنی.

  در بیشتر ویدیوها، صحنه اول باید تصویر یک زن بزرگسال یا دختر جوانِ بزرگسال داشته باشد،
  به شرطی که تصویر با موضوع ارتباط واقعی داشته باشد و گمراه‌کننده نباشد.

  برای موضوع‌هایی که مستقیماً درباره زنان یا دختران هستند،
  keywords صحنه اول باید به‌طور روشن شامل یک سوژه زنانه مرتبط باشد؛ مثل:
  adult woman, young adult woman, female scientist, female artist,
  female tailor, woman sewing, female dancer, woman historian.

  برای موضوع‌های عمومی هم، وقتی طبیعی و مرتبط است،
  سوژه صحنه اول را یک زن بزرگسالِ در حال مشاهده، آموزش، کار، پژوهش،
  مطالعه، سفر، ورزش، آشپزی، طراحی یا ساخت انتخاب کن.

  کلمه girl فقط وقتی استفاده شود که موضوع واقعاً درباره کودکی یا دختران کم‌سن است.
  در موضوع‌های عمومی، خیاطی، مد و رقص از adult woman یا young adult woman استفاده کن.

  در موضوع‌های خیاطی، keywords باید دقیق و کاربردی باشند؛ مثل:
  woman sewing machine, female tailor pattern cutting,
  adult woman hand stitching, dressmaking tutorial close up,
  fabric cutting table, sewing pattern paper.

  صحنه اول نباید همیشه با یک نمای تکراری از چهره زن شروع شود.
  بین نماهای کار، دست‌ها، ابزار، محیط، آموزش، حرکت، نمای نیم‌تنه و نمای باز تنوع ایجاد کن.

  تمام موضوع‌های عمومی قبلی حفظ شوند و حذف نشوند.
  تمرکز زنانه باید با افزایش وزن انتخاب و تعداد پیشنهادها ایجاد شود،
  نه با حذف علم، تاریخ، طبیعت، فناوری یا فرهنگ عمومی.

    در همه موضوع‌ها، تصویر هر صحنه باید دقیقاً با همان موضوع و همان روایت مرتبط باشد.
    اگر موضوع درباره خیاطی، دکمه، الگو، چرخ خیاطی، پارچه، عطر، دوخت، آرایش ابزار،
    یک مکان خاص، یک مراسم خاص یا یک شخص خاص است، کلیپ هم باید دقیقاً همان را نشان بدهد.
    از کلیپ‌های قشنگ ولی نامرتبط استفاده نکن.

    برای موضوع‌های مربوط به زنان یا دختران، صحنه اول باید تا حد امکان یک زن بزرگسالِ مرتبط با همان موضوع داشته باشد
    تا مخاطب سریع بفهمد موضوع زنانه است.
    این حضور باید واقعی، مرتبط و غیرگمراه‌کننده باشد.

    برای موضوع‌های زنانه، keywords صحنه اول باید در صورت امکان یکی از این الگوها را داشته باشد:
    adult woman, young adult woman, female teacher, female tailor, woman sewing,
    woman reading, female athlete, female artist, woman perfume store.
spoken_dialect: فارسی محاوره‌ای تهرانی خنثی، روان و قابل‌فهم برای همه فارسی‌زبان‌ها
spoken_style_notes: |-
  روایت باید گرم، صمیمی، طبیعی و کاملاً گفتاری باشد.

  انگار یک آدم آگاه و کنجکاو دارد موضوعی جالب را برای دوستش تعریف می‌کند.

  لحن نباید شبیه خبر، مقاله، کتاب درسی، پایان‌نامه،
  مستند رسمی یا گویندگی رادیویی باشد.

  لحن خودمانی باشد، ولی لوس، نمایشی، کودکانه،
  کوچه‌بازاری یا پر از تکیه‌کلام نباشد.

  جمله‌ها کوتاه، ساده و خوش‌ریتم باشند.

  هر جمله ترجیحاً کمتر از بیست واژه داشته باشد.

  از جمله‌های چندبخشی و نفس‌گیر خودداری کن.

  از فعل‌های گفتاری طبیعی استفاده کن:

  «می‌شه»

  «می‌ساختن»

  «می‌گفتن»

  «هستن»

  «داشتن»

  «می‌تونستن»

  «رو»

  «برای همین»

  «به خاطر همین»

  از عبارت‌های خیلی رسمی استفاده نکن:

  «می‌باشد»

  «می‌گردد»

  «گردید»

  «لذا»

  «بدین ترتیب»

  «واقع شده است»

  «به شمار می‌رود»

  «موجب می‌شود»

  «حائز اهمیت است»

  «شایان ذکر است»

  نمونه رسمی نامناسب:
  «این بنا در قرن پانزدهم احداث گردید.»

  نمونه گفتاری مناسب:
  «این بنا رو توی قرن پانزدهم ساختن.»

  نمونه رسمی نامناسب:
  «این سازوکار موجب کاهش دما می‌شود.»

  نمونه گفتاری مناسب:
  «این سازوکار دما رو پایین می‌آره.»

  استفاده محدود از عبارت‌های طبیعی مجاز است:

  «فکرشو بکن»

  «می‌دونی چی جالبه؟»

  «جالب‌تر اینجاست»

  «اون موقع»

  «داستان از این قراره»

  «اما ماجرا یه نکته مهم داره»

  «این بخش داستان عجیب‌تره»

  هیچ‌کدام از عبارت‌های بالا را در یک ویدیو بیشتر از یک‌بار تکرار نکن.

  در همه ویدیوها از یک تکیه‌کلام ثابت استفاده نکن.

  جمله‌ها را با نقطه، ویرگول و علامت سؤال درست بنویس
  تا صدای مصنوعی مکث طبیعی‌تری داشته باشد.

  عددها را در متن گفتار با حروف بنویس.

  نمونه:
  «چهار هزار سال»

  نه:
  «4000 سال»

  سال‌های میلادی را هم تا حد ممکن با حروف بنویس.

  نمونه:
  «سال هزار و نهصد و شصت و نه میلادی»

  برای سال‌های طولانی، در صورت مصنوعی‌شدن تلفظ،
  می‌توان عدد را به شکل قابل‌خواندن برای موتور صوتی تنظیم کرد.

  اطلاعات را برای خودمانی‌شدن تغییر نده.

  شوخی فقط وقتی استفاده شود که به موضوع آسیب نزند.

  درباره مرگ، بیماری، جنگ، نسل‌کشی، خشونت و فجایع
  لحن شوخ، هیجان‌زده یا سرگرم‌کننده نداشته باش.
