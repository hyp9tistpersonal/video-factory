# مقدار پیش‌فرض فقط برای تست است و با آن هیچ کانالی رشد نمی‌کند.
niche: "دانستنی‌های جذاب و کمتر شنیده‌شده درباره ایران؛ شامل تاریخ، فرهنگ، معماری، طبیعت، شهرها، اختراعات و شخصیت‌های ایرانی"

# نکات سبکی که همیشه به سناریونویس گفته می‌شود (اختیاری)
extra_style_notes: |
  تمام ویدیو باید مستقیماً درباره ایران باشد.
  لحن جذاب، محاوره‌ای و قابل‌باور باشد.
  ادعاهای تاریخی مشکوک، افسانه‌ای یا بدون منبع را به‌عنوان واقعیت بیان نکن.
  از توهین قومی، مذهبی و سیاسی خودداری کن.
  نام مکان‌ها و شخصیت‌ها را دقیق بنویس.
  موضوع هر ویدیو با ویدیوهای قبلی متفاوت باشد.

# موضوعات پیشنهادی — هر روز یکی تصادفی انتخاب می‌شود تا ویدیوها تکراری نشوند
topic_hints:
  - "یک بنای تاریخی ایران با داستانی کمتر شنیده‌شده"
  - "یک رسم عجیب و قدیمی در یکی از شهرهای ایران"
  - "یک اختراع یا دستاورد مهم دانشمندان ایرانی"
  - "یک مکان طبیعی شگفت‌انگیز در ایران"
  - "داستان شکل‌گیری نام یکی از شهرهای ایران"
  - "یک غذای محلی ایرانی و داستان پیدایش آن"
  - "یکی از جاده‌ها، پل‌ها یا سازه‌های تاریخی ایران"
  - "یک شخصیت ایرانی که روی جهان تأثیر گذاشت"

scenes_count: 5              # تعداد صحنه؛ ۵ صحنه ≈ ۴۰ تا ۵۵ ثانیه
voice: "fa-IR-FaridNeural"   # صدای مرد. زن: fa-IR-DilaraNeural
rate: "+8%"                  # سرعت گفتار
caption_words: 3             # چند کلمه هم‌زمان روی صفحه

model: "gemini-3.5-flash"    # اگر گوگل مدل جدیدتر رایگان داد، اینجا عوضش کن

