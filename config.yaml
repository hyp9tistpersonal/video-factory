religious_content:
  enabled: true
  perspective: شیعه امامیه، آموزشی، اخلاقی، محترمانه و غیرجدلی
  prompt_notes: |-
    محتوای مذهبی این کانال با رویکرد شیعه امامیه، آموزشی، اخلاقی و غیرجدلی تولید می‌شود.

    موضوع‌های مجاز و اولویت‌دار:
    قرآن و کاربرد مفاهیم آن در زندگی روزمره،
    نهج‌البلاغه و درس‌های عملی برای کار، خانواده، تصمیم‌گیری، خشم، دوستی،
    مدیریت، عدالت، پول، وقت، امید، صبر، عزت نفس و اخلاق،
    امام علی، امام حسین، عاشورا، اربعین، کربلا، نجف،
    حضرت فاطمه، حضرت زینب، حضرت عباس، امام سجاد، ام‌البنین
    و فرهنگ، هنر، معماری و خدمت‌رسانی مرتبط با این موضوع‌ها.

    از تولید موضوع درباره اهل سنت، خلفای اهل سنت، ابوبکر، عمر بن خطاب،
    عثمان بن عفان یا مقایسه فرقه‌ای خودداری کن.
    این محدودیت به معنی توهین یا حمله نیست؛ فقط این موضوع‌ها خارج از محدوده کانال‌اند.

    هیچ متن توهین‌آمیز، تحقیرآمیز، نفرت‌پراکن یا تحریک‌کننده علیه هیچ مذهب یا گروهی ننویس.
    هیچ موضوع مذهبی را به جدال شیعه و سنی تبدیل نکن.

    نقل‌قول مستقیم از قرآن یا نهج‌البلاغه را جعل نکن.
    اگر از شماره آیه، سوره، خطبه، نامه یا حکمت مطمئن نیستی،
    مفهوم را به‌صورت بازنویسی‌شده و بدون شماره دقیق بیان کن.
    هرگز جمله ساختگی را داخل گیومه به امام علی، امام حسین یا قرآن نسبت نده.

    در موضوع‌های روزمره نهج‌البلاغه، یک مسئله واقعی و ملموس انتخاب کن؛
    مثل خشم، حرف‌زدن، دوستی، قرض، مدیریت پول، تصمیم عجولانه،
    حسادت، غرور، انتقاد، وقت، نظم، کار، خانواده یا عدالت.
    بعد مفهوم اخلاقی را ساده، کاربردی و بدون لحن خطابه‌ای توضیح بده.

    برای موضوع‌های مذهبی سؤال کامنت باید تأملی، کاربردی و محترمانه باشد؛
    مثل اینکه مخاطب کدام پیام را در زندگی روزمره کاربردی‌تر می‌بیند.
    از سؤال فرقه‌ای، تحریک‌آمیز یا دعوت به درگیری استفاده نکن.

    در keywords ویدیو، چهره ساختگی امام علی، امام حسین، حضرت فاطمه،
    حضرت زینب یا دیگر معصومان و شخصیت‌های مقدس را پیشنهاد نده.
    برای تصویر از نمادها و فضاهای محترمانه استفاده کن:
    قرآن، نهج‌البلاغه، خوشنویسی، مسجد، حرم از نمای بیرونی،
    زائران، پیاده‌روی اربعین، پرچم، کتیبه، دست در حال مطالعه،
    چراغ، معماری اسلامی، صحرا و فضای تأملی.
  excluded_topics:
  - اهل سنت
  - موضوعات اهل سنت
  - خلفای راشدین
  - ابوبکر
  - ابو بکر
