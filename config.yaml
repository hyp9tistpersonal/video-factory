  - معماری حرم‌ها
  - خوشنویسی و نسخه‌های مذهبی
  - خدمت‌رسانی و نذر مسئولانه
  source_policy:
    fabricated_quotes_forbidden: true
    exact_reference_only_when_certain: true
    prefer_paraphrase_when_reference_is_uncertain: true
    do_not_present_weak_story_as_certain_fact: true
    distinguish_history_from_ritual_narrative: true
  visual_policy:
    do_not_depict_holy_figures_as_people: true
    do_not_generate_fake_portraits_of_holy_figures: true
    use_symbolic_respectful_visuals: true
    female_first_scene_only_when_relevant: true
    recommended_keywords:
