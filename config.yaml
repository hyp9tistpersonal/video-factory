fact_checking:
  enabled: true
  minimum_sources: 2
  preferred_source_count: 3
  require_independent_sources: true
  primary_source_preferred: true
  source_priority:
  - مقاله علمی داوری‌شده
  - دانشگاه یا مرکز پژوهشی معتبر
  - موزه یا مؤسسه تاریخی معتبر
  - سازمان علمی یا بین‌المللی رسمی
  - دانشنامه تخصصی معتبر
  - کتاب دانشگاهی
  - اسناد آرشیوی
  - وب‌سایت رسمی پروژه، مکان یا سازمان
  - رسانه معتبر برای موضوع‌های معاصر
  weak_sources:
  - پست بدون منبع شبکه اجتماعی
  - وبلاگ ناشناس
  - کانال تلگرام
  - صفحه تبلیغاتی
  - وب‌سایت‌های کپی‌کننده محتوا
  - ویدیوی بدون ذکر منبع
  - مقاله تولیدشده توسط هوش مصنوعی بدون منبع
  - صفحه‌ای که فقط به صفحه مشابه دیگری ارجاع می‌دهد
  forbidden_source_behavior:
  - استفاده از یک منبع ضعیف به‌عنوان تنها مدرک
  - تکرار ادعای وایرال بدون بررسی
  - ساختن نام کتاب، مقاله، پژوهشگر یا مؤسسه
  - استفاده از منبعی که متن آن خوانده نشده
  - استناد به عنوان مقاله بدون بررسی محتوای آن
  - تبدیل همبستگی به رابطه علت و معلولی
  uncertainty_language: |-
    اگر اطلاعات قطعی نیست، از عبارت‌های دقیق استفاده کن:

    «پژوهشگرها هنوز درباره این موضوع اتفاق‌نظر ندارن.»

    «یکی از توضیح‌های پیشنهادی اینه که...»

    «شواهد فعلی نشون می‌دن...»

    «بر اساس برآوردهای موجود...»

    «تاریخ دقیق این اتفاق مشخص نیست.»

    «منابع تاریخی روایت‌های متفاوتی دارن.»

    «این ادعا هنوز به‌طور قطعی ثابت نشده.»

    myth_language: |
  myth_language: |-
    اگر درباره افسانه، داستان عامیانه یا روایت محلی صحبت می‌کنی،
    حتماً ماهیت آن را مشخص کن:

    «طبق یک افسانه قدیمی...»

    «در یک روایت محلی گفته می‌شه...»

    «بعضی منابع قدیمی این داستان رو نقل کردن...»

    «این بخش بیشتر روایت عامیانه‌ست تا واقعیت تاریخی ثابت‌شده.»

    numeric_precision: |
  numeric_precision: |-
    عددهای تقریبی را دقیق‌تر از منبع نشان نده.

    اگر منبع نوشته «حدود پنج هزار سال»،
    عدد ساختگی مثل «پنج هزار و صد و سی سال» تولید نکن.

    برای تخمین‌ها از «حدود»، «تقریباً» یا «نزدیک به» استفاده کن.

    conflicting_sources: |
  conflicting_sources: |-
    اگر منابع معتبر با هم اختلاف دارن، اختلاف را پنهان نکن.

    نظر مورد توافق‌تر را توضیح بده و در صورت اهمیت بگو:
    «درباره این موضوع اختلاف‌نظر وجود داره.»
hook_rules:
  enabled: true
  max_words: 18
  must_connect_to_topic_immediately: true
  forbidden_generic_hooks:
